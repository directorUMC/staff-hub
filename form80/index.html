<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2B7BC4">
<title>Form 80 – Upright Migration Consultants</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #F4F7FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #14212E; }
  #f { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; transition: opacity .3s; padding: 0 16px; text-align: center; }
  #wait.gone { opacity: 0; pointer-events: none; }
  .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #DCE8F4; border-top-color: #2B7BC4; animation: s .9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 15px; }
</style>
</head>
<body>
<div id="wait"><div class="spin" aria-hidden="true"></div><p>Opening your Form 80…</p><p id="slow" hidden>Taking a while? Check your internet connection, then refresh this page. Need help? Call Upright Migration on 03 9620 9100.</p></div>
<iframe id="f" title="Form 80" allow="clipboard-write"></iframe>
<script>
/* Form 80 for clients — holder page. Shows the Staff Hub's Form 80 page (Apps Script) inside a frame with no
   Google cookies, so it works whatever Google accounts the browser is signed in to. The secret link part (t)
   is passed on and removed from the address bar. No secrets live here. */
(function () {
  var HUB = "https://script.google.com/macros/s/AKfycbwcF5ZOVAOZNKTQyKTvxB7vZCEMFYGXS7HEfAU59vsotZayAPkVjmUDgHzygd2WMeuRGw/exec";
  var p = new URLSearchParams(location.search), t = p.get("t") || "", keep = new URLSearchParams();
  keep.set("f80", /^[a-f0-9]{64}$/.test(t) ? t : "x");
  if (p.get("preview") === "1") keep.set("preview", "1");
  if (p.get("edit") === "1") keep.set("edit", "1");   // staff checking the pre-fill before sending
  var f = document.getElementById("f");
  f.setAttribute("credentialless", "");
  f.src = HUB + "?" + keep.toString();
  f.addEventListener("load", function () { setTimeout(function () { document.getElementById("wait").className = "gone"; }, 500); });
  setTimeout(function () { document.getElementById("slow").hidden = false; }, 12000);
})();
</script>
</body>
</html>
